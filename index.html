<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة أدمن العنكبوت سبورت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0}
body{background:#08080a;color:#fff;min-height:100vh;padding:16px}
.container{max-width:800px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#121216;border-radius:16px;border:1px solid rgba(220,20,30,.2);margin-bottom:16px}
.header h1{font-size:16px;color:#dc1420;font-weight:900}
.header a{color:#fff;text-decoration:none;background:#dc1420;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px}
.card{background:#121216;border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.05);margin-bottom:16px}
.card h2{font-size:15px;color:#ccc;margin-bottom:14px;border-bottom:1px solid rgba(220,20,30,.2);padding-bottom:10px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;color:#aaa;margin-bottom:6px;font-weight:600}
.fg input,.fg select{width:100%;padding:11px 14px;background:#0a0a0c;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;outline:none}
.fg input:focus,.fg select:focus{border-color:#dc1420}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#8b0000,#dc1420);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:6px}
.btn-gray{background:#333;margin-top:8px;display:none}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px;background:#0a0a0c;border-radius:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05)}
.li .info{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.li .info img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#fff;padding:3px}
.li .info .txt{flex:1;min-width:0}
.li .info .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info .sb{font-size:11px;color:#666}
.li .act{display:flex;gap:5px}
.li .act button{padding:7px 11px;border:none;border-radius:6px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600;font-size:11px;color:#fff}
.ed{background:#2196F3}.dl{background:#dc1420}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#8b0000,#dc1420);color:#fff;padding:12px 26px;border-radius:30px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;bottom:40px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙️ لوحة تحكم العنكبوت</h1>
    <a href="index.html" target="_blank">فتح التطبيق ←</a>
  </div>

  <div class="card">
    <h2 id="catTitle">➕ إضافة قسم جديد</h2>
    <input type="hidden" id="catEditId">
    <div class="fg">
      <label>اسم القسم</label>
      <input type="text" id="catName" placeholder="مثال: الرياضة، الأفلام">
    </div>
    <button class="btn" onclick="saveCat()" id="catBtn">💾 حفظ القسم</button>
    <button class="btn btn-gray" onclick="clearCat()" id="catCancel">إلغاء التعديل</button>
    <div id="catsList" style="margin-top:16px"></div>
  </div>

  <div class="card">
    <h2 id="chTitle">➕ إضافة قناة جديدة</h2>
    <input type="hidden" id="chEditId">
    <div class="fg">
      <label>اسم القناة</label>
      <input type="text" id="chName" placeholder="مثال: beIN Sports 1">
    </div>
    <div class="fg">
      <label>القسم التابع له</label>
      <select id="chCat"></select>
    </div>
    <div class="fg">
      <label>رابط الصورة (Logo)</label>
      <input type="text" id="chLogo" placeholder="https://..." dir="ltr">
    </div>
    <div class="fg">
      <label>رابط البث (m3u8 أو ts)</label>
      <input type="text" id="chUrl" placeholder="http://mag.tiger-ott.net/live/.../1030236.m3u8" dir="ltr">
    </div>
    <div class="fg">
      <label>حالة البث</label>
      <select id="chStatus">
        <option value="live">🔴 مباشر الآن</option>
        <option value="offline">⚫ غير متاح</option>
      </select>
    </div>
    <button class="btn" onclick="saveCh()" id="chBtn">💾 حفظ القناة</button>
    <button class="btn btn-gray" onclick="clearCh()" id="chCancel">إلغاء التعديل</button>
    <div id="chList" style="margin-top:16px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='alankaboot_data_v1';
let DATA={categories:[],channels:[]};
const $=id=>document.getElementById(id);

function load(){try{const d=localStorage.getItem(KEY);DATA=d?JSON.parse(d):{categories:[],channels:[]};}catch(e){DATA={categories:[],channels:[]};}}
function save(){localStorage.setItem(KEY,JSON.stringify(DATA));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function render(){renderCats();renderCatSelect();renderChs();}

function renderCats(){
  const c=$('catsList');
  if(!DATA.categories.length){c.innerHTML='<p style="color:#666;font-size:12px;text-align:center;padding:10px">لا توجد أقسام</p>';return;}
  c.innerHTML=DATA.categories.map((cat,i)=>`
    <div class="li">
      <div class="info"><div class="txt"><div class="nm">${cat.name}</div><div class="sb">${DATA.channels.filter(x=>x.categoryId===cat.id).length} قناة</div></div></div>
      <div class="act"><button class="ed" onclick="editCat(${i})">تعديل</button><button class="dl" onclick="delCat(${i})">حذف</button></div>
    </div>`).join('');
}
function renderCatSelect(){
  const s=$('chCat');
  if(!DATA.categories.length){s.innerHTML='<option value="">-- أضف قسماً أولاً --</option>';return;}
  s.innerHTML=DATA.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function saveCat(){
  const name=$('catName').value.trim(), id=$('catEditId').value;
  if(!name){toast('اكتب اسم القسم');return;}
  if(id){const i=DATA.categories.findIndex(c=>c.id===id);if(i>=0)DATA.categories[i].name=name;toast('تم التعديل');}
  else{DATA.categories.push({id:'cat_'+Date.now(),name});toast('تمت الإضافة');}
  save();clearCat();render();
}
function editCat(i){const c=DATA.categories[i];$('catName').value=c.name;$('catEditId').value=c.id;$('catTitle').textContent='✏️ تعديل القسم';$('catBtn').textContent='💾 حفظ التعديلات';$('catCancel').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function delCat(i){const c=DATA.categories[i];if(!confirm(`حذف "${c.name}" وكل قنواته؟`))return;DATA.channels=DATA.channels.filter(x=>x.categoryId!==c.id);DATA.categories.splice(i,1);save();render();toast('تم الحذف');}
function clearCat(){$('catName').value='';$('catEditId').value='';$('catTitle').textContent='➕ إضافة قسم جديد';$('catBtn').textContent='💾 حفظ القسم';$('catCancel').style.display='none';}

function renderChs(){
  const c=$('chList');
  if(!DATA.channels.length){c.innerHTML='<p style="color:#666;font-size:12px;text-align:center;padding:10px">لا توجد قنوات</p>';return;}
  c.innerHTML=DATA.channels.map((ch,i)=>{
    const cat=DATA.categories.find(x=>x.id===ch.categoryId);
    return `<div class="li"><div class="info"><img src="${ch.logo||'https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'}" onerror="this.src='https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'"><div class="txt"><div class="nm">${ch.name} ${ch.status==='live'?'<span style="color:#dc1420;font-size:10px">● مباشر</span>':''}</div><div class="sb">${cat?cat.name:'بدون قسم'}</div></div></div><div class="act"><button class="ed" onclick="editCh(${i})">تعديل</button><button class="dl" onclick="delCh(${i})">حذف</button></div></div>`;
  }).join('');
}
function saveCh(){
  const name=$('chName').value.trim(), categoryId=$('chCat').value, logo=$('chLogo').value.trim(), url=$('chUrl').value.trim(), status=$('chStatus').value, id=$('chEditId').value;
  if(!name||!url){toast('املأ الاسم والرابط');return;}
  if(!categoryId){toast('اختر القسم');return;}
  if(id){const i=DATA.channels.findIndex(c=>c.id===id);if(i>=0)DATA.channels[i]={...DATA.channels[i],name,categoryId,logo,url,status};toast('تم التعديل');}
  else{DATA.channels.push({id:'ch_'+Date.now(),name,categoryId,logo,url,status});toast('تمت الإضافة');}
  save();clearCh();render();
}
function editCh(i){const ch=DATA.channels[i];$('chName').value=ch.name;$('chCat').value=ch.categoryId;$('chLogo').value=ch.logo||'';$('chUrl').value=ch.url;$('chStatus').value=ch.status;$('chEditId').value=ch.id;$('chTitle').textContent='✏️ تعديل القناة';$('chBtn').textContent='💾 حفظ التعديلات';$('chCancel').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function delCh(i){if(!confirm('حذف القناة؟'))return;DATA.channels.splice(i,1);save();render();toast('تم الحذف');}
function clearCh(){$('chName').value='';$('chLogo').value='';$('chUrl').value='';$('chStatus').value='live';$('chEditId').value='';$('chTitle').textContent='➕ إضافة قناة جديدة';$('chBtn').textContent='💾 حفظ القناة';$('chCancel').style.display='none';}

load();render();
window.addEventListener('storage',e=>{if(e.key===KEY){load();render();}});
</script>
</body>
</html>
