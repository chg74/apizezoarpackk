<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Alankaboot Sport - Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Cairo,sans-serif;
}

body{
  background:#080304;
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

.header{
  background:linear-gradient(145deg,#200507,#100304);
  border:1px solid #5c1016;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.header h1{
  color:#ff4757;
  font-size:22px;
}

.header p{
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}

.card{
  background:linear-gradient(145deg,#1d0608,#100304);
  border:1px solid #4c0c12;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  font-size:16px;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  background:#080304;
  border:1px solid #4c0c12;
  border-radius:10px;
  color:#fff;
  outline:none;
}

button{
  border:0;
  padding:12px 20px;
  border-radius:10px;
  background:linear-gradient(90deg,#8b0000,#dc1420);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

button.delete{
  background:#31070a;
  color:#ff6873;
}

.status{
  margin-top:10px;
  font-size:12px;
  color:#aaa;
}

.list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}

.item{
  background:#100304;
  border:1px solid #3e0a0f;
  border-radius:14px;
  padding:12px;
}

.item img{
  width:70px;
  height:70px;
  border-radius:12px;
  object-fit:contain;
  background:#050202;
  display:block;
  margin-bottom:10px;
}

.item strong{
  display:block;
  margin-bottom:10px;
}

.item small{
  color:#999;
  display:block;
  margin-bottom:10px;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🕷️ Alankaboot Sport - لوحة الأدمن</h1>
    <p>إدارة القوائم والقنوات وروابط البث</p>
  </div>


  <!-- إنشاء قائمة -->

  <div class="card">

    <h2>📁 إنشاء قائمة قنوات</h2>

    <input
      id="categoryName"
      placeholder="اسم القائمة - مثال: beIN Sports">

    <input
      id="categoryImage"
      placeholder="رابط صورة القائمة">

    <button onclick="addCategory()">
      إضافة القائمة
    </button>

  </div>


  <!-- إضافة قناة -->

  <div class="card">

    <h2>📺 إضافة قناة داخل قائمة</h2>

    <select id="categorySelect">
      <option value="">اختر القائمة</option>
    </select>

    <input
      id="channelName"
      placeholder="اسم القناة - مثال: beIN Sports 1">

    <input
      id="channelImage"
      placeholder="رابط صورة القناة">

    <input
      id="channelUrl"
      placeholder="رابط البث m3u8 أو الرابط المباشر">

    <button onclick="addChannel()">
      إضافة القناة
    </button>

  </div>


  <!-- القوائم -->

  <div class="card">

    <h2>📁 القوائم الموجودة</h2>

    <div id="categoriesList" class="list"></div>

  </div>


  <div class="card">

    <h2>📺 القنوات الموجودة</h2>

    <div id="channelsList"></div>

  </div>


  <div class="status" id="status">
    جاري الاتصال...
  </div>

</div>


<script>

/* =========================================
   MQTT
========================================= */

const BROKER =
  'wss://broker.emqx.io:8084/mqtt';

const TOPIC_DATA =
  'kwtspta_9f3a2b1c/data';

const TOPIC_CMD =
  'kwtspta_9f3a2b1c/cmd';


let db = {
  categories: []
};


let client;


try{

  client = mqtt.connect(
    BROKER,
    {
      clientId:
        'admin_' +
        Math.random()
        .toString(36)
        .slice(2,10),

      reconnectPeriod:3000
    }
  );


  client.on('connect',()=>{

    document.getElementById('status')
      .textContent =
      '🟢 متصل بالسيرفر';

    client.subscribe(
      TOPIC_DATA
    );

  });


  client.on('reconnect',()=>{

    document.getElementById('status')
      .textContent =
      '🟡 جاري إعادة الاتصال...';

  });


  client.on('error',()=>{

    document.getElementById('status')
      .textContent =
      '🔴 خطأ في الاتصال';

  });


  client.on('message',(topic,msg)=>{

    if(topic !== TOPIC_DATA)
      return;

    try{

      const data =
        JSON.parse(msg.toString());

      if(
        data &&
        Array.isArray(data.categories)
      ){

        db = data;

        render();

      }

    }
    catch(e){}

  });

}
catch(e){}


/* =========================================
   PUBLISH
========================================= */

function publish(){

  if(!client)
    return;

  client.publish(
    TOPIC_DATA,
    JSON.stringify(db),
    {
      qos:1,
      retain:true
    }
  );

}


/* =========================================
   ADD CATEGORY
========================================= */

function addCategory(){

  const name =
    document.getElementById(
      'categoryName'
    ).value.trim();

  const image =
    document.getElementById(
      'categoryImage'
    ).value.trim();


  if(!name){

    alert('اكتب اسم القائمة');

    return;

  }


  const category = {

    id:
      'cat_' +
      Date.now(),

    name:name,

    image:image,

    channels:[]

  };


  db.categories.push(
    category
  );


  publish();


  document.getElementById(
    'categoryName'
  ).value='';

  document.getElementById(
    'categoryImage'
  ).value='';


  render();

}


/* =========================================
   ADD CHANNEL
========================================= */

function addChannel(){

  const categoryId =
    document.getElementById(
      'categorySelect'
    ).value;

  const name =
    document.getElementById(
      'channelName'
    ).value.trim();

  const image =
    document.getElementById(
      'channelImage'
    ).value.trim();

  const url =
    document.getElementById(
      'channelUrl'
    ).value.trim();


  if(!categoryId){

    alert('اختر القائمة');

    return;

  }


  if(!name){

    alert('اكتب اسم القناة');

    return;

  }


  if(!url){

    alert('ضع رابط البث');

    return;

  }


  const category =
    db.categories.find(
      x => x.id === categoryId
    );


  if(!category)
    return;


  category.channels.push({

    id:
      'ch_' +
      Date.now(),

    name:name,

    image:image,

    url:url,

    live:true

  });


  publish();


  document.getElementById(
    'channelName'
  ).value='';

  document.getElementById(
    'channelImage'
  ).value='';

  document.getElementById(
    'channelUrl'
  ).value='';


  render();

}


/* =========================================
   DELETE CATEGORY
========================================= */

function deleteCategory(id){

  if(
    !confirm(
      'حذف القائمة وكل القنوات الموجودة بداخلها؟'
    )
  )
    return;


  db.categories =
    db.categories.filter(
      x => x.id !== id
    );


  publish();

  render();

}


/* =========================================
   DELETE CHANNEL
========================================= */

function deleteChannel(
  categoryId,
  channelId
){

  const category =
    db.categories.find(
      x => x.id === categoryId
    );


  if(!category)
    return;


  category.channels =
    category.channels.filter(
      x => x.id !== channelId
    );


  publish();

  render();

}


/* =========================================
   RENDER
========================================= */

function render(){

  const select =
    document.getElementById(
      'categorySelect'
    );


  select.innerHTML =
    '<option value="">اختر القائمة</option>';


  db.categories.forEach(c=>{

    select.innerHTML += `
      <option value="${escapeAttr(c.id)}">
        ${escapeHTML(c.name)}
      </option>
    `;

  });


  const categoriesList =
    document.getElementById(
      'categoriesList'
    );


  if(!db.categories.length){

    categoriesList.innerHTML =
      '<div style="color:#888">لا توجد قوائم</div>';

  }
  else{

    categoriesList.innerHTML =
      db.categories.map(c=>`

        <div class="item">

          ${
            c.image
            ?
            `<img src="${escapeAttr(c.image)}">`
            :
            ''
          }

          <strong>
            ${escapeHTML(c.name)}
          </strong>

          <small>
            ${c.channels.length} قناة
          </small>

          <button
            class="delete"
            onclick="deleteCategory('${escapeAttr(c.id)}')">

            حذف القائمة

          </button>

        </div>

      `).join('');

  }


  const channelsList =
    document.getElementById(
      'channelsList'
    );


  let html='';


  db.categories.forEach(c=>{

    if(!c.channels.length)
      return;


    html += `
      <div style="
        color:#ff4757;
        font-weight:900;
        margin:15px 0 10px;
      ">
        📁 ${escapeHTML(c.name)}
      </div>
    `;


    c.channels.forEach(ch=>{

      html += `

        <div class="item"
          style="margin-bottom:10px">

          ${
            ch.image
            ?
            `<img src="${escapeAttr(ch.image)}">`
            :
            ''
          }

          <strong>
            ${escapeHTML(ch.name)}
          </strong>

          <small>
            ${escapeHTML(ch.url)}
          </small>

          <button
            class="delete"
            onclick="
              deleteChannel(
                '${escapeAttr(c.id)}',
                '${escapeAttr(ch.id)}'
              )
            ">

            حذف القناة

          </button>

        </div>

      `;

    });

  });


  channelsList.innerHTML =
    html ||
    '<div style="color:#888">لا توجد قنوات</div>';

}


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(v){

  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function escapeAttr(v){

  return escapeHTML(v);

}


/* =========================================
   START
========================================= */

render();

</script>

</body>
</html>
